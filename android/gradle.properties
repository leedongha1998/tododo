# buildscript classpath에 kotlin-gradle-plugin 1.9.0을 박아 두는데, 이 프로젝트는 Kotlin
# 2.4.0 / AGP 9.1.0이라 그 1.9.0이 끼어들면 app 모듈의 javac가 플러그인의 Kotlin 클래스를
# 못 찾는다(:app:compileReleaseJavaWithJavac에서 FlutterFirebaseCorePlugin not found).
# true로 두면 AGP 9의 Built-in Kotlin이 컴파일해 firebase_core·home_widget 둘 다 통과한다.
# 2026-11-05 확인 — 바꾸기 전에 반드시 릴리스 빌드로 검증할 것.
android.builtInKotlin=true
